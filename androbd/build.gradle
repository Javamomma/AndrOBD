apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = 'com.fr3ts0n.ecu.gui.androbd'
    compileSdk 37

    buildFeatures {
        resValues = true
        buildConfig = true
        compose = true
    }

    defaultConfig {
        minSdk 23
        targetSdkVersion 37
        versionCode 30002
        versionName 'V3.0.2'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        resValue "string", "app_version", versionName
        manifestPlaceholders = [appLabel: "@string/app_name"]

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }

    lint {
        // Existing findings (278 issues, 187 of them Error severity as of
        // 2026-07-24) are grandfathered into this baseline rather than fixed
        // individually -- fixing them is real, separate effort. New lint
        // issues not in the baseline still fail the build.
        disable 'MissingTranslation'
        disable 'BidiSpoofing'
        baseline = file("lint-baseline.xml")
    }

    buildTypes {
        debug {
            // personal fork build: installs next to the official AndrOBD
            applicationIdSuffix '.fold'
            versionNameSuffix '-fold'
            manifestPlaceholders = [appLabel: "AndrOBD Fold"]
            buildConfigField "boolean", "FOLD_TEST_HOOKS", "true"
        }
        release {
            buildConfigField "boolean", "FOLD_TEST_HOOKS", "false"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // (declared after release so initWith copies its R8 settings)
        // optimised personal build for the phone (R8, not debuggable), same package + key as debug
        fold {
            initWith release
            applicationIdSuffix '.fold'
            versionNameSuffix '-fold'
            manifestPlaceholders = [appLabel: "AndrOBD Fold"]
            signingConfig = signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField "boolean", "FOLD_TEST_HOOKS", "true"
        }
    }
}

dependencies {
    implementation project(':plugin')
    implementation project(':library')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
    implementation 'com.github.anastr:speedviewlib:1.6.1'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // foldable split view (Jetpack Compose)
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Local (JVM) unit tests
    testImplementation 'junit:junit:4.13.2'

    // Android instrumented tests
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
